<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Song · My Life Arcade</title>
<meta name="description" content="My Life Arcade by Mark — ten games of memories, mini-games and a message wall. Insert coin.">
<meta property="og:type" content="website">
<meta property="og:title" content="My Life Arcade · Mark">
<meta property="og:description" content="Ten games of memories, mini-games and a message wall. Insert coin.">
<meta property="og:image" content="og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="My Life Arcade · Mark">
<meta name="twitter:image" content="og.png">
<meta name="theme-color" content="#04100a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Great+Vibes&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>
<div class="crt-fx" aria-hidden="true"></div>
<div id="progress" aria-hidden="true"></div>
<div id="cursor" aria-hidden="true"><i class="c-dot"></i><i class="c-box"><b class="k1"></b><b class="k2"></b><b class="k3"></b><b class="k4"></b><em id="c-label"></em></i></div>
<div id="wipe" aria-hidden="true"></div>
<div id="sig" aria-hidden="true"><span>Drikcy</span><i class="px-heart"></i></div>

<header class="hud">
  <a class="brand" href="index.html" id="brand" aria-label="Back to the arcade floor"><span>CY</span><i class="px-heart" aria-hidden="true"></i></a>
  <div class="hud-mid"><span class="u1">1UP</span><b id="score">000000</b><span class="hi">HI-SCORE <b>MEMORIES</b></span></div>
  <div class="hud-r"><span id="clock">TIME 00:00</span><span class="cr" id="credits">COINS 00</span><button id="snd" aria-pressed="true" title="Sound">♪ ON</button></div>
</header>

<main id="main">
  <!-- ARCADE FLOOR -->

  <!-- INSIDE A GAME -->
  <section id="inside" class="view">
    <div class="bar">
      <a class="px-btn" id="back" href="index.html" aria-label="Back to Homepage" data-cursor="EXIT">← Back to Homepage</a>
      <div class="bar-txt">
        <small id="lvl">STAGE 01 / 10</small>
        <h2 id="title"></h2>
      </div>
      <div class="lives" aria-hidden="true"><small>LIVES</small><span><i class="px-heart"></i><i class="px-heart"></i><i class="px-heart"></i></span></div>
      <button class="px-btn" id="add" hidden data-cursor="ADD">+ ADD PICS</button>
    </div>
    <p class="note" id="note"></p>
    <div id="body"></div>
    <nav class="pager" id="pager"></nav>
  </section>

  <footer class="foot">
    <span>© 1984 MY LIFE ARCADE · MADE BY MARK FOR <em class="fsig">Drikcy ♥</em></span><span>ALL MEMORIES RESERVED</span><span>1UP</span>
  </footer>
  <input type="file" id="file" hidden>
</main>

<!-- lightbox -->
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-bg"></div>
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-ui">
    <span id="lb-count"></span>
    <p id="lb-cap"></p>
    <div class="lb-nav">
      <button class="px-btn sq" id="lb-prev" aria-label="Previous photo">◀</button>
      <button class="px-btn sq" id="lb-next" aria-label="Next photo">▶</button>
    </div>
  </div>
  <button class="px-btn sq lb-x" id="lb-close" aria-label="Close">✕</button>
  <span class="lb-hint">CLICK OR PRESS ESC TO CLOSE</span>
</div>

<!-- game over -->
<div id="gameover" role="alertdialog" aria-label="Wrong passcode">
  <div id="tumble"></div>
  <div class="go-box">
    <small>✖ WRONG PASSCODE ✖</small>
    <h2 class="go-t" data-text="GAME OVER">GAME OVER</h2>
    <p class="go-c">CONTINUE? <b id="cont">9</b></p>
    <div class="go-bar"><i id="go-fill"></i></div>
    <div class="go-btns"><button class="px-btn solid" id="retry">▶ CONTINUE</button><button class="px-btn" id="quit">EXIT</button></div>
  </div>
</div>

<script>window.__API_BASE__=null;window.ROOT="";window.PAGE=6;</script>
<script src="js/app.js"></script>
<script src="js/fx.js"></script>
</body></html>
